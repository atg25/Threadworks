name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chat_app

    env:
      MIX_ENV: test
      OPENAI_API_KEY: sk-test-stub-ci

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.15.7"
          otp-version: "26.2"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            chat_app/deps
            chat_app/_build
          key: mix-${{ runner.os }}-${{ hashFiles('chat_app/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test.setup --exclude real_api --exclude e2e

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: chat_app/assets/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('chat_app/assets/package.json') }}

      - run: npm install
        working-directory: chat_app/assets
      - run: npm test
        working-directory: chat_app/assets
